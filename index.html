<!DOCTYPE html>
<html>
<head>
  <title>My Game Website</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    iframe {
      width: 960px;
      height: 600px;
      border: none;
      border-radius: 12px;
      display: block;
      margin: 20px auto;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>🎮 Play My Game</h1>

  <button onclick="fullscreenGame()">Full Screen Game</button>

  <iframe 
    id="gameFrame"
    src="https://lolygames.github.io/gd-lit/"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <script>
    function fullscreenGame() {
      const iframe = document.getElementById("gameFrame");

      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
        window.open("about:blank", "_blank");
      }
    });
  </script>

</body>
</html>
