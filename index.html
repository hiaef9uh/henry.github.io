<!DOCTYPE html>
<html>
<head>
  <title>DONT SHOW ANYONE</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .game-section {
      margin-bottom: 50px;
    }

    iframe {
      width: 960px;
      height: 600px;
      border: none;
      border-radius: 12px;
      display: block;
      margin: 20px auto;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>🎮 My Game Arcade</h1>

  <!-- GAME 1 -->
  <div class="game-section">
    <h2>Game 1</h2>
    <button onclick="fullscreenGame('game1')">Full Screen Game 1</button>
    <iframe 
      id="game1"
      src="https://lolygames.github.io/gd-lit/"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <!-- GAME 2 -->
  <div class="game-section">
    <h2>Game 2</h2>
    <button onclick="fullscreenGame('game2')">Full Screen Game 2</button>
    <iframe 
      id="game2"
      src="https://1games.io/game/slope-rider-3d/"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <!-- GAME 3 -->
  <div class="game-section">
    <h2>Game 3</h2>
    <button onclick="fullscreenGame('game3')">Full Screen Game 3</button>
    <iframe 
      id="game3"
      src="https://basketballlegends.pro/game/basketball-legends/"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    function fullscreenGame(id) {
      const iframe = document.getElementById(id);

      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") {
        if (document.fullscreenElement) {
          document.exitFullscreen();
        }
        window.open("about:blank", "_blank");
      }
    });
  </script>

</body>
</html>
